name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile header-only connected-info ABI probe
        run: |
          cmake -S tests/native_abi -B build/native-abi
          cmake --build build/native-abi --config Release

      - name: Record native connected-info layout
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            build/native-abi/Release/nozzle_info_abi.exe > build/native-abi/connected-info.json
          else
            build/native-abi/nozzle_info_abi > build/native-abi/connected-info.json
          fi
          cat build/native-abi/connected-info.json

      - run: dotnet build Nozzle.NET.sln

      - run: dotnet test Nozzle.NET.sln --no-build --verbosity normal
        env:
          NOZZLE_INFO_ABI_JSON: ${{ github.workspace }}/build/native-abi/connected-info.json
